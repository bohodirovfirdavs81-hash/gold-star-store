<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Star</title>
  <link rel="stylesheet" href="style.css">
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

header {
  padding: 24px 18px;
  background: #111111;
  border-bottom: 1px solid #252525;
}

h1, h2, h3 {
  color: #ffffff;
}

button {
  background: #e6b82e;
  color: #111111;
  border: none;
  border-radius: 12px;
  padding: 13px 20px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 20px;
  margin: 12px 0;
}

a {
  color: #e6b82e;
  text-decoration: none;
} 
  </style>
</head>

<body>
  <script src="script.js"></script>

  <header>
    <div class="logo">⭐ GOLD STAR</div>
    <div class="subtitle">Быстро. Безопасно. Выгодно.</div>
  </header>

  <section class="balance">
    <div class="muted">Ваш баланс</div>
    <div class="amount">0 сум</div>
    <button class="gold" onclick="alert('Пополнение скоро будет доступно')">
      Пополнить баланс
    </button>
  </section>

  <div class="grid">
    <button class="item" onclick="window.location.href='https://t.me/GoldStar_uz_bot?start=stars'">
      <span class="emoji">⭐</span>
      Telegram Stars
    </button>

    <button class="item" onclick="window.location.href='https://t.me/GoldStar_uz_bot?start=premium'">
      <span class="emoji">👑</span>
      Telegram Premium
    </button>

    <button class="item" onclick="alert('Telegram Gifts')">
      <span class="emoji">🎁</span>
      Telegram Gifts
    </button>

    <button class="item" onclick="alert('История покупок')">
      <span class="emoji">◷</span>
      История покупок
    </button>
  </div>

  <div class="support">
    <strong>🎧 Поддержка</strong>
    <p class="muted">Есть вопросы? Мы поможем!</p
                                                .
  </div>

</body>
</html>
